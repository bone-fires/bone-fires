<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="780"
     height="560"
     viewBox="0 0 780 560">

    <defs>
        <style><![CDATA[
            .bg{
                fill:#0b0f0b;
            }

            .title{
                fill:#8dff8d;
                font:700 23px "JetBrains Mono","Cascadia Code","Consolas",monospace;
            }

            .label{
                fill:#38ff7a;
                font:18px "JetBrains Mono","Cascadia Code","Consolas",monospace;
            }

            .value{
                fill:#d8ffd8;
                font:18px "JetBrains Mono","Cascadia Code","Consolas",monospace;
            }

            .quote{
                fill:#7aff7a;
                font-style:italic;
                font:17px "JetBrains Mono","Cascadia Code","Consolas",monospace;
            }

            .divider{
                fill:#2dff72;
                font:18px monospace;
            }
        ]]></style>

        <filter id="glow">
            <feGaussianBlur stdDeviation="1.3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <rect class="bg" width="100%" height="100%" rx="12"/>

    <text class="title" x="28" y="42" filter="url(#glow)">
🛡 andrew@grant
    </text>

    <text class="divider" x="25" y="68">
──────────────────────────────────────────────────────────────────────────────
    </text>

    <text class="label" x="30" y="105">.OS:</text>
    <text class="value" x="255" y="105">Arch Linux, Windows</text>

    <text class="label" x="30" y="135">.Uptime:</text>
    <text class="value" x="255" y="135">22 years, 5 months, 29 days</text>

    <text class="label" x="30" y="165">.Host:</text>
    <text class="value" x="255" y="165">Digital Squire</text>

    <text class="label" x="30" y="195">.Kernel:</text>
    <text class="value" x="255" y="195">Code Alchemist (Scribe) v1.0</text>

    <text class="label" x="30" y="225">.IDE:</text>
    <text class="value" x="255" y="225">Neovim, VSCode, Tumblr Terminal</text>

    <text class="label" x="30" y="275">Languages.Arcane:</text>
    <text class="value" x="255" y="275">Java, Python, JavaScript, C++</text>

    <text class="label" x="30" y="305">Languages.Scrolls:</text>
    <text class="value" x="255" y="305">HTML, CSS, Markdown, YAML</text>

    <text class="label" x="30" y="335">Languages.Mortal:</text>
    <text class="value" x="255" y="335">English, Elvish</text>

    <text class="label" x="30" y="385">Hobbies.Alchemy:</text>
    <text class="value" x="255" y="385">Custom Tumblr Themes, CSS Modding</text>

    <text class="label" x="30" y="415">Hobbies.Smithing:</text>
    <text class="value" x="255" y="415">Overclocking, PC Building, Git</text>

    <text class="divider" x="25" y="448">
──────────────────────────────────────────────────────────────────────────────
    </text>

    <text class="label" x="30" y="480">Guild Contacts</text>

    <text class="value" x="55" y="510">Email.Scroll   : your@email.com</text>
    <text class="value" x="55" y="535">Discord        : your_username</text>

</svg>
